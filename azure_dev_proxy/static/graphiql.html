<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphiQL - Azure auth proxy</title>
    <style>
      body { margin: 0; }
      #graphiql { height: 100dvh; }
      .loading {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color-scheme: light dark;
        background: Canvas;
        color: CanvasText;
        font: 14px/1.5 system-ui, sans-serif;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://esm.sh/graphiql@6.0.0/dist/style.css"
      integrity="sha384-pHzXVzR6TL0s+jcKLsjQ4WlRVmR8RPyAJsLyyym4TLpYnIWUPf20JavS0VxzUz1Y"
      crossorigin="anonymous"
    />
    <script type="importmap" nonce="__NONCE__">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.1",
          "react/": "https://esm.sh/react@19.3.1/",
          "react-dom": "https://esm.sh/react-dom@19.3.1",
          "react-dom/": "https://esm.sh/react-dom@19.3.1/",
          "graphiql": "https://esm.sh/graphiql@6.0.0?standalone&external=react,react-dom,@graphiql/react,graphql",
          "graphiql/": "https://esm.sh/graphiql@6.0.0/",
          "graphiql/setup-workers/esm.sh": "https://esm.sh/graphiql@6.0.0/setup-workers/esm.sh?deps=@graphiql/react@1.0.1",
          "@graphiql/react": "https://esm.sh/@graphiql/react@1.0.1?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid",
          "@graphiql/toolkit": "https://esm.sh/@graphiql/toolkit@1.0.0?standalone&external=graphql",
          "graphql": "https://esm.sh/graphql@17.0.2",
          "@emotion/is-prop-valid": "data:text/javascript,"
        },
        "integrity": {
          "https://esm.sh/react@19.3.1": "sha384-ut1U+oIs0ClaOE7uF1+DZAaHVvYvEJZME3mUuqn95yVqQ70a+8u2LN2LD37JgJkO",
          "https://esm.sh/react-dom@19.3.1": "sha384-FKbbSw/nINZRM0ej/iwjfXbJeAZMJdBKqKmn/I+aIM4Io5qupmM8sZJxaJZDO0sv",
          "https://esm.sh/graphiql@6.0.0": "sha384-4t9K5VrZG+S+yt/m4xfOIM5zsF8FMY4l2Aftx55bVhOvtBuLThHoSK3eammwCVAR",
          "https://esm.sh/graphiql@6.0.0/setup-workers/esm.sh?deps=@graphiql/react@1.0.1": "sha384-uRZR11cNRp3axJoK9E9JWMf12kxXKGZBy7exaCZkEc3uP6sbi5f6W7RSYth46lVu",
          "https://esm.sh/graphiql@6.0.0?standalone&external=react,react-dom,@graphiql/react,graphql": "sha384-Cyeb/6CXzM443S0753DNctp2rJbXK7Yh2n9mzeYa+e7qMIqJb0XFRgw4wBFEXNfW",
          "https://esm.sh/@graphiql/react@1.0.1?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid": "sha384-J+G5cflCBCPKFjkS8Lt7qA6W39wy/LSB09Pzb+9DgLqZ1XcDlyrMbfZ/pBqZVXlc",
          "https://esm.sh/@graphiql/toolkit@1.0.0?standalone&external=graphql": "sha384-pW1hwiHXozNQ020c1EOLfZkjDANM06ecupsD3iPgx8Az8u2zlYrOL9JhjsjsyMOu",
          "https://esm.sh/graphql@17.0.2": "sha384-IPvlcmnvWT91sKqwbg9MxPXJUuPmSdwXCp22x6hcbBkAEhlfSKkMLR3v19K9iRUp"
        }
      }
    </script>
    <script type="module" nonce="__NONCE__">
      import React from 'react';
      import ReactDOM from 'react-dom/client';
      import { GraphiQL } from 'graphiql';
      import { createTransport } from '@graphiql/toolkit';
      import 'graphiql/setup-workers/esm.sh';

      const transport = createTransport({
        url: __TRANSPORT_URL__,
        fetch: (url, options) => fetch(`/${url}`, options),
      });

      function App() {
        return React.createElement(GraphiQL, {
          transport,
          defaultEditorToolsVisibility: true,
        });
      }

      const container = document.getElementById('graphiql');
      const root = ReactDOM.createRoot(container);
      root.render(React.createElement(App));
    </script>
  </head>
  <body>
    <div id="graphiql">
      <div class="loading" role="status">Loading GraphiQL...</div>
    </div>
  </body>
</html>
