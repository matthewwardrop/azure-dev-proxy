[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "azure-dev-proxy"
version = "0.1.0"
description = "Loopback HTTP(S) proxy with HTTPS-only Azure CLI authentication"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.14,<4", "idna>=3.7,<4"]

[project.scripts]
azure-dev-proxy = "azure_dev_proxy.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["azure_dev_proxy"]

[tool.hatch.envs.default]
dependencies = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "coverage[toml]==7.17.0",
    "ruff==0.17.4",
    "ty==0.0.98",
]

[tool.hatch.envs.default.scripts]
unit-test = "pytest {args}"
coverage = "pytest --cov --cov-report=term-missing {args}"
lint = ["ruff check .", "ruff format --check .", "ty check"]
tests = ["coverage", "lint"]
format = ["ruff check --fix .", "ruff format ."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_debug = true
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["azure_dev_proxy"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 100
show_missing = true
precision = 2
